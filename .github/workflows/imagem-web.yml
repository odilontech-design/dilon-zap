# Constrói a imagem do site (apps/web) FORA da VPS e guarda no GitHub Container
# Registry, etiquetada com o commit.
#
# Por quê: o build do Next dentro da VPS disputa CPU e memória com o worker do
# WhatsApp e já derrubou a sessão de clientes (ver docs/sdr-piloto.md). Com a
# imagem pronta aqui, a VPS só baixa e troca o contêiner — scripts/deploy-web-imagem.sh.
#
# Roda a cada push na main e também sob demanda (aba Actions → Run workflow).
# Não faz deploy: a troca na VPS continua sendo uma decisão de quem está lá.
name: Imagem do site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: imagem-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # A chave pública de notificações entra no bundle no build (ver o
          # Dockerfile). Configure em Settings → Secrets and variables →
          # Actions → Variables, com o MESMO valor do .env da VPS.
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          tags: |
            ghcr.io/odilontech-design/dilon-zap-web:${{ github.sha }}
            ghcr.io/odilontech-design/dilon-zap-web:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
