# Produção: Postgres, web e worker cada um no seu container, Caddy na frente
# cuidando de HTTPS automático (Let's Encrypt) pro domínio configurado no
# Caddyfile. O storage de mídia (R2) continua na nuvem — só o banco é local.

# Rotação de log. O driver json-file padrão do Docker NÃO tem limite de
# tamanho: o arquivo cresce até encher o disco, e aí tudo para de uma vez, sem
# aviso. Passou a ser urgente quando o worker começou a registrar os pedidos
# de reenvio do WhatsApp (ver baileys-logger.ts), que aumentam o volume.
# 10MB x 3 arquivos por container = no máximo ~120MB no total.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Precisa acompanhar a major do dump que foi restaurado aqui (veio do
    # Neon, Postgres 18) — pg_restore não aceita restaurar de uma major mais
    # nova do que o servidor.
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # A partir da 18 a imagem oficial espera o volume em /var/lib/postgresql
      # (e não mais em .../data) — ela cria um subdiretório por major dentro,
      # pra permitir pg_upgrade sem cruzar fronteira de mount. Montar direto
      # em .../data faz o container recusar a subir.
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    # Sem `ports:` de propósito — o banco fica só na rede interna do Docker,
    # alcançável por web/worker e por nada mais. Publicar 5432 no host abriria
    # o Postgres pra internet inteira.
    expose:
      - "5432"
    # Ajustado pra VPS pequena (1 vCPU / 2GB): os padrões do Postgres assumem
    # uma máquina bem maior e brigariam por memória com web + worker.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=50
      -c wal_compression=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vem do .env pela interpolação do compose. Ver o comentário no
        # Dockerfile do web: NEXT_PUBLIC_* tem que existir no build.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    logging: *log
    env_file: .env
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    logging: *log
    env_file: .env
    # A memória do worker sobe de ~190 para ~410 MB em 20 h com o heap do JS
    # parado em ~60 MB: crescimento fora do heap, típico de fragmentação do
    # malloc da glibc. Poucas arenas seguram isso. O teto existe para um
    # estouro derrubar só este contêiner (o restart do compose o devolve), e não
    # a VPS inteira. Medir o rssMB do log "memoria" de novo depois de aplicar.
    environment:
      MALLOC_ARENA_MAX: "2"
    mem_limit: 700m
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy

  # Worker do SDR (prospecção): processa importações de CSV e qualificações da fila
  # no Postgres. Sem WhatsApp, sem porta e sem nenhuma chave de serviço externo.
  #
  # Não usa env_file de propósito: o .env do Zap tem o segredo do worker do
  # WhatsApp, as chaves do R2, do Mercado Pago e da Asaas, e este processo não
  # usa nenhuma delas. Recebe só o endereço do banco.
  #
  # Subir só DEPOIS do db push do SDR: antes disso ele apenas registra erro de
  # tabela ausente no log, a cada ciclo, sem efeito em mais nada.
  sdr-worker:
    build:
      context: .
      dockerfile: apps/sdr-worker/Dockerfile
    restart: unless-stopped
    logging: *log
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # O Node enxerga a memória do contêiner, mas o teto explícito evita que o
      # heap cresça até o limite do mem_limit e o kernel mate o processo.
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    # Dá tempo de terminar o lote em andamento ao parar. Se não terminar, a
    # reserva do trabalho vence e outro ciclo o retoma sem duplicar nada.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Vendedor IA: atende o WhatsApp das revendas com o estoque, pela API da
  # Anthropic. Processo próprio, como o do SDR: se a API ficar lenta, a chave
  # vencer ou o processo cair, o WhatsApp de todos os clientes segue normal
  # (só a IA para de responder). Não usa env_file: recebe só o que usa.
  #
  # Subir só DEPOIS do db push do Vendedor IA.
  vendedor-ia-worker:
    build:
      context: .
      dockerfile: apps/vendedor-ia-worker/Dockerfile
    restart: unless-stopped
    logging: *log
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Para acordar a fila de saída do worker do WhatsApp na hora.
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL}
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET}
      # Endereço do site, para o link do carro na vitrine.
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Sincronização do estoque com os portais (OLX). Processo próprio: se cair,
  # só os anúncios atrasam; WhatsApp, CRM e vitrine seguem normais.
  portais-worker:
    build:
      context: .
      dockerfile: apps/portais-worker/Dockerfile
    restart: unless-stopped
    logging: *log
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORTAIS_CHAVE: ${PORTAIS_CHAVE}
      # Endereço público do Zap: a OLX baixa as fotos dos anúncios por ele.
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Segundo produto, container próprio. Compartilha o Postgres da VPS, mas em
  # banco separado (ESQUADRIAS_DATABASE_URL no .env) — são clientes
  # diferentes, e um dump do Zap não pode arrastar dado de serralheria junto.
  esquadrias:
    # Não sobe num `docker compose up -d` comum: hoje este produto roda na
    # Vercel (esquadrias.dilontech.com.br resolve pra lá, não pra esta VPS),
    # e o banco dele está no Neon. Sem o perfil, um `up -d` de rotina subia
    # um segundo servidor do mesmo produto, apontado pra um banco local
    # vazio e sem receber tráfego nenhum — duas bases divergentes que só
    # aparecem quando alguém reclama que sumiu um orçamento.
    #
    # Pra rodar aqui de propósito (migração ou teste), o serviço continua
    # inteiro e é só pedir:
    #   docker compose -f docker-compose.prod.yml --profile esquadrias up -d
    # Antes disso, as variáveis ESQUADRIAS_* precisam existir no .env.
    profiles: ["esquadrias"]
    build:
      context: .
      dockerfile: apps/esquadrias/Dockerfile
    restart: unless-stopped
    logging: *log
    env_file: .env
    # O env_file é o MESMO do Zap, e o NEXTAUTH_URL de lá aponta pro domínio
    # dele. Sem este override o login daqui redirecionaria pro
    # zap.dilontech.com.br e o callback nunca voltaria — e o segredo
    # compartilhado faria um cookie de um produto ser aceito pelo outro.
    # São dois produtos: domínio próprio e segredo próprio.
    # O ":-" evita o aviso de "variável não definida" em TODO comando de
    # rotina do Zap. Silenciar aqui não remove a proteção: o NextAuth se
    # recusa a subir em produção sem NEXTAUTH_SECRET, então quem ativar o
    # perfil sem configurar descobre na hora, pelo container que não sobe —
    # que é onde o erro precisa aparecer. Aviso que toca todo dia sem ter o
    # que fazer só ensina a ignorar aviso.
    environment:
      NEXTAUTH_URL: ${ESQUADRIAS_NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${ESQUADRIAS_NEXTAUTH_SECRET:-}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
